```html
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Demander un site - QuickSite</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #172033;
        }

        header {
            background: #111827;
            color: white;
            text-align: center;
            padding: 65px 20px;
        }

        header h1 {
            font-size: 42px;
            margin: 0 0 12px;
        }

        header p {
            font-size: 18px;
            margin: 0;
            color: #d1d5db;
        }

        .formulaire {
            width: calc(100% - 30px);
            max-width: 750px;
            margin: 40px auto;
            padding: 35px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
        }

        .info {
            background: #eff6ff;
            border-left: 4px solid #2563eb;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        label {
            font-weight: bold;
            margin-top: 12px;
        }

        input,
        textarea {
            width: 100%;
            padding: 14px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 16px;
            font-family: Arial, sans-serif;
            background: white;
            transition: border-color 0.2s, box-shadow 0.2s;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
        }

        textarea {
            min-height: 130px;
            resize: vertical;
        }

        button {
            margin-top: 20px;
            background: #2563eb;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.2s;
        }

        button:hover {
            background: #1d4ed8;
            transform: translateY(-1px);
        }

        button:active {
            transform: translateY(0);
        }

        .retour {
            display: block;
            text-align: center;
            margin-top: 25px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }

        .retour:hover {
            text-decoration: underline;
        }

        @media (max-width: 600px) {
            header {
                padding: 45px 20px;
            }

            header h1 {
                font-size: 32px;
            }

            header p {
                font-size: 16px;
            }

            .formulaire {
                margin: 20px auto;
                padding: 22px;
                border-radius: 12px;
            }

            input,
            textarea {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Demander un site</h1>
    <p>Parlez-nous de votre projet</p>
</header>

<main class="formulaire">

    <div class="info">
        Remplissez ce formulaire avec le plus d'informations
        possible afin que nous puissions comprendre votre projet
        et vous proposer un site adapté à vos besoins.
    </div>

    <form
        action="mailto:quickesite.contact@gmail.com"
        method="post"
        enctype="text/plain"
    >

        <label for="nom">
            Prénom et nom *
        </label>

        <input
            type="text"
            id="nom"
            name="Nom"
            placeholder="Exemple : Thomas Martin"
            autocomplete="name"
            required
        >


        <label for="entreprise">
            Nom de l'entreprise *
        </label>

        <input
            type="text"
            id="entreprise"
            name="Entreprise"
            placeholder="Exemple : Martin Coiffure"
            autocomplete="organization"
            required
        >


        <label for="email">
            Adresse e-mail *
        </label>

        <input
            type="email"
            id="email"
            name="Email"
            placeholder="exemple@email.com"
            autocomplete="email"
            required
        >


        <label for="telephone">
            Numéro de téléphone
        </label>

        <input
            type="tel"
            id="telephone"
            name="Telephone"
            placeholder="Votre numéro"
            autocomplete="tel"
        >


        <label for="adresse">
            Adresse de l'entreprise
        </label>

        <input
            type="text"
            id="adresse"
            name="Adresse"
            placeholder="Rue, ville..."
            autocomplete="street-address"
        >


        <label for="activite">
            Type d'activité *
        </label>

        <input
            type="text"
            id="activite"
            name="Activite"
            placeholder="Exemple : Restaurant, coiffeur..."
            required
        >


        <label for="site">
            Avez-vous déjà un site internet ?
        </label>

        <input
            type="url"
            id="site"
            name="Site_actuel"
            placeholder="https://exemple.com"
        >


        <label for="couleur">
            Quelles couleurs souhaitez-vous ?
        </label>

        <input
            type="text"
            id="couleur"
            name="Couleurs"
            placeholder="Exemple : bleu et blanc"
        >


        <label for="pages">
            Quelles pages souhaitez-vous ?
        </label>

        <textarea
            id="pages"
            name="Pages"
            placeholder="Exemple : Accueil, Services, À propos, Contact..."
        ></textarea>


        <label for="projet">
            Décrivez votre projet *
        </label>

        <textarea
            id="projet"
            name="Projet"
            placeholder="Expliquez-nous ce que vous souhaitez sur votre site..."
            required
        ></textarea>


        <label for="exemples">
            Avez-vous des exemples de sites que vous aimez ?
        </label>

        <textarea
            id="exemples"
            name="Exemples"
            placeholder="Vous pouvez mettre des liens ou expliquer ce que vous aimez."
        ></textarea>


        <label for="informations">
            Informations supplémentaires
        </label>

        <textarea
            id="informations"
            name="Informations_supplementaires"
            placeholder="Autres informations importantes..."
        ></textarea>


        <button type="submit">
            Envoyer ma demande
        </button>

    </form>

    <a class="retour" href="index.html">
        ← Retour au site
    </a>

</main>

</body>
</html>
```
